<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d58">
<meta name="mobile-web-app-capable" content="yes">
<title>مهامي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#1b2b24;--mut:#6b7c74;--g:#0f9d58;--gd:#0b8043;--ln:#dfe7e3;--danger:#d93025;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1c2521;--tx:#e8f0ec;--mut:#93a49b;--ln:#2b3732}}
:root[data-theme="dark"]{--bg:#121816;--card:#1c2521;--tx:#e8f0ec;--mut:#93a49b;--ln:#2b3732}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:720px;margin:0 auto;padding:12px}
h1{margin:0 0 10px;font-size:20px;background:var(--g);color:#fff;padding:12px 14px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date]{flex:1;min-width:0;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;background:var(--g);color:#fff}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:8px 10px;font-size:14px}
button.rec{background:var(--danger)}
.tabs button{flex:1}.tabs button.on{background:var(--g);color:#fff}
table{width:100%;border-collapse:collapse}
th{background:var(--gd);color:#fff;padding:9px;font-size:14px}
th:first-child{border-radius:0 10px 0 0}th:last-child{border-radius:10px 0 0 0}
td{padding:9px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.c{width:44px;text-align:center}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--g)}
tr.done .t{text-decoration:line-through;color:var(--mut)}
.d{color:var(--mut);font-size:13px;white-space:nowrap;width:90px}
.x{background:none;color:var(--danger);padding:4px 8px;font-size:18px}
.mut{color:var(--mut);font-size:13px;text-align:center;padding:14px}
#msg{font-size:13px;color:var(--mut);margin-top:6px;min-height:18px}
</style>
</head>
<body>
<h1>✅ مهامي</h1>

<div class="card">
  <div class="row">
    <input type="text" id="t" placeholder="اكتب المهمة…" enterkeyhint="done">
    <button id="mic" title="إدخال صوتي">🎤</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="add" style="flex:1">إضافة (التاريخ تلقائي)</button>
  </div>
  <div id="msg"></div>
</div>

<div class="card row tabs">
  <button class="s on" data-f="all">الكل</button>
  <button class="s" data-f="open">غير منجزة</button>
  <button class="s" data-f="done">منجزة</button>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <table>
    <thead><tr><th>✓</th><th>المهمة</th><th>التاريخ</th><th></th></tr></thead>
    <tbody id="b"></tbody>
  </table>
  <div class="mut" id="empty" hidden>لا توجد مهام بعد</div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:6px">
    <button id="sync" style="flex:1">☁️ مزامنة مع Google Sheets</button>
    <button class="s" id="cfg" title="ضبط الرابط">⚙️</button>
  </div>
  <div class="row">
    <button class="s" id="cp">📋 نسخ لـ Google Sheets</button>
    <button class="s" id="csv">⬇️ تنزيل CSV</button>
    <button class="s" id="imp">⬆️ استيراد</button>
    <button class="s" id="clr">🧹 حذف المنجزة</button>
  </div>
  <input type="file" id="file" accept=".csv,.tsv,.txt" hidden>
  <div class="mut" style="padding:8px 0 0">البيانات محفوظة على جهازك فقط. لنقلها إلى Sheets: اضغط «نسخ» ثم الصق في الخلية A1.</div>
</div>

<script>
(function(){
var KEY="tasks_v1",tasks=[],filter="all";
function load(){try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tasks=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){say("تعذّر الحفظ على هذا المتصفح")}}
var $=function(i){return document.getElementById(i)};
function say(m){$("msg").textContent=m}
function today(){var d=new Date(),p=function(n){return String(n).padStart(2,"0")};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var list=tasks.filter(function(t){return filter=="all"||(filter=="done")==t.done});
  $("b").innerHTML=list.map(function(t){
    return '<tr class="'+(t.done?"done":"")+'"><td class="c"><input type="checkbox" data-i="'+t.id+'"'+(t.done?" checked":"")+'></td><td class="t">'+esc(t.text)+'</td><td class="d">'+(t.date||"")+'</td><td><button class="x" data-x="'+t.id+'">✕</button></td></tr>';
  }).join("");
  $("empty").hidden=list.length>0;
}
function add(text,date){
  text=(text||"").trim();if(!text)return;
  tasks.unshift({id:Date.now()+Math.random(),text:text,date:date||"",done:false});
  save();render();
}
$("add").onclick=function(){add($("t").value,today());$("t").value="";$("t").focus()};
$("t").onkeydown=function(e){if(e.key=="Enter")$("add").click()};
$("b").onclick=function(e){
  var i=e.target.getAttribute("data-i"),x=e.target.getAttribute("data-x");
  if(i){tasks.forEach(function(t){if(String(t.id)==i)t.done=e.target.checked});save();render()}
  if(x){tasks=tasks.filter(function(t){return String(t.id)!=x});save();render()}
};
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){filter=b.getAttribute("data-f");document.querySelectorAll(".tabs button").forEach(function(o){o.classList.toggle("on",o==b)});render()}
});

/* الإدخال الصوتي */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
$("mic").onclick=function(){
  if(!SR){say("المتصفح لا يدعم الإدخال الصوتي — استخدم زر المايك في لوحة المفاتيح");return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang="ar-SA";rec.interimResults=false;
  rec.onstart=function(){$("mic").classList.add("rec");say("🎙️ تكلّم الآن…")};
  rec.onresult=function(e){var s=e.results[0][0].transcript.trim();if(s){add(s,today());say("تمت إضافة: "+s)}};
  rec.onerror=function(e){
    if(e.error=="not-allowed"||e.error=="service-not-allowed")say("المايك غير مسموح: اضغط على رمز القفل بجانب الرابط ← الأذونات ← اسمح بالميكروفون، ثم أعد المحاولة");
    else if(e.error=="no-speech")say("لم أسمع شيئاً، حاول مرة أخرى");
    else if(e.error=="network")say("التعرف الصوتي يحتاج إنترنت");
    else say("تعذّر التعرف الصوتي: "+e.error)};
  rec.onend=function(){$("mic").classList.remove("rec");rec=null};
  try{rec.start()}catch(err){rec=null}
};

/* التصدير */
function cell(s){s=String(s).replace(/\t|\n/g," ");return s}
function tsv(){return ["منجزة\tالمهمة\tالتاريخ"].concat(tasks.map(function(t){return (t.done?"TRUE":"FALSE")+"\t"+cell(t.text)+"\t"+t.date})).join("\n")}
$("cp").onclick=function(){
  var s=tsv();
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){say("تم النسخ ✔ الصقها في Google Sheets")},function(){
    var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");say("تم النسخ ✔ الصقها في Google Sheets")}catch(e){say("تعذّر النسخ")}a.remove()});
};
$("csv").onclick=function(){
  var rows=[["منجزة","المهمة","التاريخ"]].concat(tasks.map(function(t){return [t.done?"TRUE":"FALSE",t.text,t.date]}));
  var s="\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));a.download="tasks.csv";
  document.body.appendChild(a);a.click();a.remove();say("إذا لم يبدأ التنزيل استخدم «نسخ لـ Sheets»");
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    var n=0;r.result.replace(/^\ufeff/,"").split(/\r?\n/).slice(1).forEach(function(l){
      var p=l.indexOf("\t")>-1?l.split("\t"):l.split(",");
      var txt=(p[1]||"").replace(/^"|"$/g,"");if(!txt)return;
      tasks.push({id:Date.now()+Math.random(),text:txt,date:(p[2]||"").replace(/"/g,"").trim(),done:/true/i.test(p[0])});n++});
    save();render();say("تم استيراد "+n+" مهمة")};
  r.readAsText(f);this.value="";
};
$("clr").onclick=function(){
  var n=tasks.filter(function(t){return t.done}).length;
  if(n&&confirm("حذف "+n+" مهمة منجزة؟")){tasks=tasks.filter(function(t){return !t.done});save();render()}
};
/* المزامنة مع Google Sheets عبر Apps Script */
var UK="sheet_url_v1";
function getUrl(){try{return localStorage.getItem(UK)||""}catch(e){return ""}}
function setUrl(){
  var u=prompt("الصق رابط تطبيق الويب (Web app URL) من Apps Script:",getUrl());
  if(u===null)return false;
  u=u.trim();
  if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){say("الرابط غير صحيح — يجب أن ينتهي بـ /exec");return false}
  try{localStorage.setItem(UK,u)}catch(e){}
  say(u?"تم حفظ الرابط ✔":"تم مسح الرابط");return !!u;
}
$("cfg").onclick=setUrl;
$("sync").onclick=function(){
  if(!getUrl()&&!setUrl())return;
  say("جارٍ الإرسال…");
  var rows=tasks.slice().reverse().map(function(t){return [!!t.done,t.text,t.date]});
  fetch(getUrl(),{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({tasks:rows})})
  .then(function(){say("تم الإرسال ✔ ("+rows.length+" مهمة) — افتح الشيت للتأكد")},
        function(){say("لا يوجد اتصال بالإنترنت — حاول لاحقاً")});
};
load();render();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
